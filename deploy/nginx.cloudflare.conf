# nginx behind Cloudflare Tunnel. No TLS here — Cloudflare terminates it and
# cloudflared delivers plain HTTP to this listener, which is not published on
# any host port. Selected by docker-compose.cloudflare.yml.
#
# CF-Connecting-IP is the visitor. X-Forwarded-For would also carry the tunnel
# connector's hop, and the app trusts exactly one hop, so forward the Cloudflare
# header alone. Only cloudflared can reach this listener, so it is trustworthy.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
server_tokens off;

server {
    listen 80;
    server_name _;

    # Matches MAX_CONTENT_LENGTH in security.init_security (25 MB per upload).
    client_max_body_size 25m;

    location /static/ {
        alias /srv/odin-static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $client_ip;
        # Cloudflare always fronts with HTTPS; the app needs to know so the
        # session cookie stays Secure and HSTS is emitted.
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Server;
        proxy_read_timeout 120s;
    }
}
