# nginx behind Cloudflare Tunnel. No TLS here — Cloudflare terminates it and
# cloudflared delivers plain HTTP to this listener, which is not published on
# any host port. Selected by docker-compose.cloudflare.yml.
#
# CF-Connecting-IP is the visitor. X-Forwarded-For would also carry the tunnel
# connector's hop, and the app trusts exactly one hop, so forward the Cloudflare
# header alone. Only cloudflared can reach this listener, so it is trustworthy.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
server_tokens off;

# Access log without secrets (as gunicorn_logger.py does for the app's own
# log): guest, sign-up, sign-in and reset links carry their credential in the
# path, so the path and the referer are logged as /guest/[redacted] and the
# like. The response's X-Request-Id ties a line to the app's log and to the
# reference a person quotes from an error page.
map $request_uri $odin_uri {
    "~^(?<odin_u1>/(?:guest|join|auth/link|auth/reset|api/join)/)[^/?]+(?<odin_u2>.*)$" "${odin_u1}[redacted]${odin_u2}";
    default $request_uri;
}
map $http_referer $odin_referer {
    "~^(?<odin_r1>.*?/(?:guest|join|auth/link|auth/reset|api/join)/)[^/?]+(?<odin_r2>.*)$" "${odin_r1}[redacted]${odin_r2}";
    default $http_referer;
}
# Used in each server block: there it replaces the image's own access_log
# (at http level a second one would add a log, not replace the unredacted one).
log_format odin '$remote_addr - [$time_local] "$request_method $odin_uri $server_protocol" $status $body_bytes_sent '
                '"$odin_referer" "$http_user_agent" $request_time $upstream_http_x_request_id';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log odin;

    # JSON compresses about tenfold: the Flow's Gantt with every rollout is megabytes as the app sends it
    gzip on;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 101m;   # the upload policy's ceiling; the app enforces the admin's smaller limit

    location /static/ {
        alias /srv/odin-static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  "";   # never pass on a client's claim about the host
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $client_ip;
        # Cloudflare always fronts with HTTPS; the app needs to know so the
        # session cookie stays Secure and HSTS is emitted.
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Server;
        proxy_read_timeout 120s;
    }
}
