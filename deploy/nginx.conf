# TLS terminates here; the app never sees plain HTTP in production.
# X-Forwarded-* are honoured by the app only when PMS_TRUST_PROXY=1, which
# compose sets — without that flag every request would look like it came from
# nginx itself, collapsing the login rate limiter into one shared bucket.

# Behind Cloudflare Tunnel the visitor's address arrives in CF-Connecting-IP;
# X-Forwarded-For would also carry the tunnel connector's hop, and the app
# trusts exactly one hop, so it would record the connector for every user —
# one shared rate-limit bucket, and an audit log full of the same address.
# Direct (no Cloudflare) deployments have no CF header and fall back to the
# TCP peer. Only cloudflared can reach this listener, so the header is trusted.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
server_tokens off;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # If these disagree, the larger one just produces a worse error message.
    client_max_body_size 101m;   # the upload policy's ceiling; the app enforces the admin's smaller limit

    location /static/ {
        alias /srv/odin-static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  "";   # never pass on a client's claim about the host
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_read_timeout 120s;
    }
}
