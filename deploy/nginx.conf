# TLS terminates here; the app never sees plain HTTP in production.
# X-Forwarded-* are honoured by the app only when PMS_TRUST_PROXY=1, which
# compose sets — without that flag every request would look like it came from
# nginx itself, collapsing the login rate limiter into one shared bucket.

# This listener is published on the host (ports 80/443), so anyone can reach
# it and send any header: a client-supplied CF-Connecting-IP must never become
# the address the app records and rate-limits by (one fake header per guess
# would dodge the login limiter). The TCP peer is the only address trusted
# here. Behind Cloudflare Tunnel use deploy/nginx.cloudflare.conf instead,
# whose listener only cloudflared can reach, so its CF-Connecting-IP is real.
server_tokens off;

# Access log without secrets (as gunicorn_logger.py does for the app's own
# log): guest, sign-up, sign-in and reset links carry their credential in the
# path, so the path and the referer are logged as /guest/[redacted] and the
# like. The response's X-Request-Id ties a line to the app's log and to the
# reference a person quotes from an error page.
map $request_uri $odin_uri {
    "~^(?<odin_u1>/(?:guest|join|auth/link|auth/reset|api/join)/)[^/?]+(?<odin_u2>.*)$" "${odin_u1}[redacted]${odin_u2}";
    default $request_uri;
}
map $http_referer $odin_referer {
    "~^(?<odin_r1>.*?/(?:guest|join|auth/link|auth/reset|api/join)/)[^/?]+(?<odin_r2>.*)$" "${odin_r1}[redacted]${odin_r2}";
    default $http_referer;
}
# Used in each server block: there it replaces the image's own access_log
# (at http level a second one would add a log, not replace the unredacted one).
log_format odin '$remote_addr - [$time_local] "$request_method $odin_uri $server_protocol" $status $body_bytes_sent '
                '"$odin_referer" "$http_user_agent" $request_time $upstream_http_x_request_id';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log odin;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log odin;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # JSON compresses about tenfold: the Flow's Gantt with every rollout is megabytes as the app sends it
    gzip on;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # If these disagree, the larger one just produces a worse error message.
    client_max_body_size 101m;   # the upload policy's ceiling; the app enforces the admin's smaller limit

    location /static/ {
        alias /srv/odin-static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  "";   # never pass on a client's claim about the host
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # never a client-supplied CF-Connecting-IP (see the top)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_read_timeout 120s;
    }
}
