{% extends "base.html" %}
{% block title %}Sign in by email{% endblock %}
{% block content %}
<div class="login-box">
  <h1>Odin</h1>
  <p class="muted">Partners and customers sign in with a link sent to the email address they were invited with. It works once and expires in 30 minutes.</p>
  <form method="post">
<input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Email
      <input type="email" name="email" required autofocus autocomplete="email"></label>
    <button type="submit">Email me a sign-in link</button>
  </form>
  <p class="muted" style="margin-top:1rem;"><a href="{{ url_for('login') }}">Staff sign-in</a></p>
</div>
{% endblock %}
