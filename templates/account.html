{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<h1>My Account</h1>
<div class="panel" style="max-width:400px; margin-bottom:1.5rem;">
  <h2>Email (for notifications)</h2>
  <form method="post" action="{{ url_for('account_email') }}">
<input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Email Address
      <input type="email" name="email" value="{{ user.email or '' }}" placeholder="you@company.com"></label>
    <button type="submit">Save Email</button>
  </form>
</div>
<div class="panel" style="max-width:400px;">
  <h2>Change Password</h2>
  <form method="post">
<input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Current Password
      <input type="password" name="current_password" required></label>
    <label>New Password
      <input type="password" name="new_password" required minlength="8"></label>
    <button type="submit">Update Password</button>
  </form>
</div>
{% endblock %}
