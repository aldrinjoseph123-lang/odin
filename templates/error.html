<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Odin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=raven2">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
  <script nonce="{{ csp_nonce() }}">
    (function () {  // same pre-paint rule as the React app
      try {
        var t = localStorage.getItem("odin.theme") || "system", a = localStorage.getItem("odin.accent") || "blue";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light"; document.documentElement.dataset.accent = a;
      } catch (e) {}
    })();
  </script>
  <style>
    /* A standalone page: it must render when the app itself is what failed,
       so it carries its own copy of the few tokens it needs. */
    :root { --bg:#FFFFFF; --fg:#101114; --muted:#6B7280; --border:#E4E6EB; --card:#FFFFFF; --primary:#3D5AFE; --on-primary:#FFFFFF; color-scheme: light; }
    :root[data-theme="dark"] { --bg:#0F1115; --fg:#E7E8EC; --muted:#9AA0AB; --border:#262B34; --card:#15181E; color-scheme: dark; }
    :root[data-accent="indigo"] { --primary:#4F46E5 } :root[data-accent="violet"] { --primary:#7C3AED } :root[data-accent="teal"] { --primary:#0F766E }
    :root[data-accent="green"] { --primary:#15803D } :root[data-accent="sky"] { --primary:#0369A1 } :root[data-accent="plum"] { --primary:#A21CAF }
    :root[data-accent="ink"] { --primary:#101114 } :root[data-theme="dark"][data-accent="ink"] { --primary:#E7E8EC; --on-primary:#0F1115 }
    * { box-sizing: border-box }
    body { margin:0; min-height:100svh; display:flex; align-items:center; justify-content:center; padding:16px;
           background:var(--bg); color:var(--fg); font:13px/1.5 Inter, system-ui, -apple-system, sans-serif; }
    .card { max-width:28rem; width:100%; border:1px solid var(--border); border-radius:11px; background:var(--card); padding:32px; text-align:center; }
    .code { color:var(--muted); font-size:12px; }
    .brand { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:20px; }
    .word { font:700 16px/1 'Chakra Petch', Inter, sans-serif; letter-spacing:.12em; }
    .o { color:#E11D2E; }   /* brand red: the logo only */
    h1 { font-family:'Chakra Petch', Inter, sans-serif; }
    h1 { margin:6px 0 10px; font-size:20px; font-weight:600; letter-spacing:-0.025em; }
    p { margin:0 0 20px; color:var(--muted); }
    a.btn { display:inline-block; background:var(--primary); color:var(--on-primary); text-decoration:none; font-weight:500;
            border-radius:8px; padding:7px 14px; }
    a.btn:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="/favicon.svg?v=raven2" alt="" width="28" height="28"><span class="word"><span class="o">&Oslash;</span>DIN</span></div>
    <div class="code">Error {{ code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ hint }}</p>
    <a class="btn" href="{{ url_for('board') if current_user else url_for('login') }}">{{ 'Back to the flow' if current_user else 'Sign in' }}</a>
  </main>
</body>
</html>
