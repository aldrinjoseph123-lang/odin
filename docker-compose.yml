# Odin — production compose.
#
#   1. cp .env.example .env   and fill in SECRET_KEY (the app refuses to boot
#      without it) plus your Azure app credentials if you use Microsoft 365.
#   2. docker compose up -d --build
#
# odin-data holds odin.db and every uploaded document. Back it up; losing it
# loses the product. Nothing else in the stack is stateful.
# Container logs rotate (json-file keeps growing otherwise): 3 x 10 MB each.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    logging: *logging
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ODIN_DATA_DIR: /data
      PMS_HTTPS: "1"        # marks the session cookie Secure
      PMS_TRUST_PROXY: "1"  # honour X-Forwarded-* from nginx (see security.init_security)
    volumes:
      - odin-data:/data
      # A backup share (see the scheduler below) goes here too: Back up now runs in this container.
      # - /mnt/nas/odin:/mnt/backup-share
    expose:
      - "8000"

  nginx:
    logging: *logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/srv/odin-static:ro
      - ./deploy/certs:/etc/nginx/certs:ro

  # The clock for recurring jobs (scheduler.py): the daily digest and the
  # backups, at the times set in Settings (Notifications, Backups), in the
  # workspace time zone. Settings → Backups shows whether it is running.
  scheduler:
    logging: *logging
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ODIN_DATA_DIR: /data
      PYTHONUNBUFFERED: "1"   # job lines reach `docker compose logs scheduler` as they happen
    volumes:
      - odin-data:/data
      # A NAS / file-server share for backups: mount it here and in the app
      # above, and set Settings → Backups → Share folder path to /mnt/backup-share.
      # - /mnt/nas/odin:/mnt/backup-share
    # The app creates and migrates the database on start; wait for it.
    depends_on:
      app:
        condition: service_healthy
    # Same entrypoint as the app (SECRET_KEY and data-dir checks), its own command.
    command: ["python", "scheduler.py"]
    # The image's check calls the web port, which this container doesn't
    # serve; healthy here means a heartbeat in the last 3 minutes.
    healthcheck:
      test: ["CMD", "python", "scheduler.py", "--healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  odin-data:
