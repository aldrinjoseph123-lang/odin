# Runs on every push to dev and main and on every pull request: the unit suite on the Python the image
# uses, then a real Docker build with a boot + health check — the image was
# never built on the development machine, so this is where it is proven.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Re-render the UI suite's golden screenshots (download the ui-suite artifact and commit them)"
        type: boolean
        default: false

# Nothing here writes to the repository (the Release workflow does, on its own).
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in flight; a push to main never
# cancels the run that may be about to tag a release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Python tests
        # the whole output, no pipe: a failure prints where it happened. -u: print() output stays in order.
        # Every test_*.py module is named here (test_v18_meta checks the list against the files on disk).
        run: python -u -m unittest test_app test_fix_security test_fix_logic test_release_safety test_scheduler_ops test_v18_identity test_v18_notify test_v18_projects test_v18_ops test_v18_client test_v18_leftovers test_v18_infra test_v18_fixes test_v18_resend test_v2_fields test_v2_deps test_v2_switches test_v2_lock test_v2_gates test_v2_intake test_v2_workload test_v2_milestones test_v2_selfserve test_v2_tools test_v2_rules test_v2_notify test_v2_lead test_v2_integrate test_v2_fixes test_v2_review test_v2_hardening test_v2_atomic test_v2_friction test_v18_meta
      - name: Server updater self-check
        run: sh deploy/test-odin-update.sh
      - name: Dependency advisories (pip-audit)
        run: pip install -q pip-audit && pip-audit -r requirements.txt

  map:
    name: System map matches the code (pull requests into main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # the branch as committed, not GitHub's merge with main
          fetch-depth: 0                                    # the generator reads the history and the tags
      - name: docs/system-map.html facts are current (VERSION is committed before the map is generated)
        run: python3 scripts/build_system_map.py --check || { echo "::error::Run python3 scripts/build_system_map.py, commit docs/system-map.html and push (see docs/RELEASING.md)"; exit 1; }

  frontend:
    name: Frontend builds (React + shadcn)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Dependency advisories (npm audit, runtime deps, high+)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Lint (oxlint with the accessibility rules; the warning baseline is the --max-warnings in frontend/package.json)
        run: npm run lint
        working-directory: frontend
      - name: "Tests (vitest: units, pages, the API contract)"
        run: npm test
        working-directory: frontend
      - name: "Types (tsc -b: the app, the build scripts and the e2e specs, strict) and build"
        run: npm run build
        working-directory: frontend

  ui:
    name: "UI suite (Playwright: smoke, journeys, axe, keyboard, screenshots, Lighthouse)"
    runs-on: ubuntu-24.04
    needs: [frontend]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Playwright (all tiers except @visual)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_snapshots) }}
        run: npx playwright test --grep-invert @visual
        working-directory: frontend
        env:
          E2E_PYTHON: python
      # Non-blocking until the goldens are re-rendered after the 9 Oct refresh:
      # run CI by hand with update_snapshots, commit the artifact, then delete
      # continue-on-error and the --grep-invert above.
      - name: Playwright @visual (goldens; not blocking yet)
        continue-on-error: true
        run: npx playwright test ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots && '--update-snapshots' || '' }} --grep @visual
        working-directory: frontend
        env:
          E2E_PYTHON: python
      - name: Lighthouse budget and bundle ceiling
        run: |
          (cd "$GITHUB_WORKSPACE" && ODIN_DATA_DIR=/tmp/odin-e2e SECRET_KEY=e2e-not-secret PORT=5099 python -c "from app import app; app.run(host='127.0.0.1', port=5099)") &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5099/healthz >/dev/null 2>&1 && break; sleep 1; done
          node e2e/perf.mjs
        working-directory: frontend
      - name: Report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-suite
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/e2e/**/*-snapshots
          retention-days: 14

  docker:
    name: Docker image builds and boots
    runs-on: ubuntu-24.04
    needs: [test, frontend, ui]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t odin:ci .
      - name: Refuses to start without SECRET_KEY
        run: |
          if docker run --rm odin:ci true; then echo "started without SECRET_KEY — entrypoint guard broken"; exit 1; fi
          echo "guard OK"
      - name: Boots and answers /healthz
        run: |
          docker run -d --name odin -e SECRET_KEY=$(openssl rand -hex 32) -p 8000:8000 odin:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz | grep -q ok; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "never became healthy"; docker logs odin; exit 1
      - name: Secrets and state never enter the image
        run: |
          printf 'SECRET_KEY=must-not-ship\n' > .env
          mkdir -p deploy/certs uploads && echo key > deploy/certs/privkey.pem && echo x > odin.db
          docker build -q -t odin:leak .
          docker run --rm -e SECRET_KEY=x odin:leak sh -c 'test ! -e /app/.env && test ! -e /app/deploy/certs/privkey.pem && test ! -e /app/odin.db && test -f /app/scripts/set_password.py' \
            && echo "image clean" || { echo "a secret or state file is baked into the image"; exit 1; }
          rm -f .env deploy/certs/privkey.pem odin.db
      - name: Compose files are valid (base + Cloudflare overlay)
        run: |
          printf 'SECRET_KEY=x\nCLOUDFLARE_TUNNEL_TOKEN=x\n' > .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.host-tunnel.yml config -q
